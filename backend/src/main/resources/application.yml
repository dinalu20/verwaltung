spring:
  application:
    name: moschee-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moschee}
    username: ${DB_USER:moschee}
    password: ${DB_PASSWORD:moschee}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisToASecureRandomStringAtLeast256BitsLongForHS256Algorithm!!}
    access-token-expiration-ms: 28800000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:}
  default-admin:
    username: admin
    password: ${ADMIN_PASSWORD:admin123}
    full-name: Administrator
