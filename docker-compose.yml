services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moschee
      POSTGRES_USER: moschee
      POSTGRES_PASSWORD: moschee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moschee"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: moschee
      DB_USER: moschee
      DB_PASSWORD: moschee
      JWT_SECRET: ChangeThisToASecureRandomStringAtLeast256BitsLongForHS256Algorithm!!
      ADMIN_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
